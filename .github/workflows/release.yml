name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Icon
        run: python scripts/make_icon.py
        continue-on-error: true

      - name: Winres
        run: |
          go install github.com/akavel/rsrc@latest
          $env:PATH = "$(go env GOPATH)\bin;" + $env:PATH
          if (Test-Path assets/icon.ico) {
            rsrc -manifest assets/ui.manifest -ico assets/icon.ico -arch amd64 -o cmd/ply/rsrc_windows.syso
            rsrc -manifest assets/app.manifest -ico assets/icon.ico -arch amd64 -o cmd/setup/rsrc_windows.syso
            New-Item -ItemType Directory -Force cmd/worker | Out-Null
            rsrc -manifest assets/app.manifest -ico assets/icon.ico -arch amd64 -o cmd/worker/rsrc_windows.syso
          }

      - name: Build Ply
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist, payload | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/Ply.exe ./cmd/ply
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/PlyCore.exe ./cmd/worker

      - name: Fetch Xray
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xrayout -Force
          Copy-Item dist/Ply.exe payload/Ply.exe
          Copy-Item dist/PlyCore.exe payload/PlyCore.exe
          Copy-Item xrayout/xray.exe payload/xray.exe
          Copy-Item xrayout/geoip.dat payload/geoip.dat
          Copy-Item xrayout/geosite.dat payload/geosite.dat
          Copy-Item xrayout/wintun.dll payload/wintun.dll

      - name: Payload zip
        run: |
          Compress-Archive -Path payload\* -DestinationPath cmd/setup/payload.zip -Force

      - name: Build installer
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/PlySetup.exe ./cmd/setup
          Copy-Item README.txt dist/README.txt
          Compress-Archive -Path dist/PlySetup.exe, dist/README.txt -DestinationPath dist/Ply-2.0.4-win64.zip -Force
          Compress-Archive -Path payload\* -DestinationPath dist/Ply-portable-2.0.4-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ply-windows
          path: |
            dist/PlySetup.exe
            dist/Ply-2.0.4-win64.zip
            dist/Ply-portable-2.0.4-win64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4
          name: Ply 2.0.4
          body: |
            2.0.4. Grok и другие ИИ идут по имени через туннель, а не по адресу провайдера. .ru по-прежнему напрямую. IPv6 в туннель не кладём.
            Ключи: vless, hy2, vmess, trojan, ss.
          files: |
            dist/Ply-2.0.4-win64.zip
            dist/PlySetup.exe
            dist/Ply-portable-2.0.4-win64.zip
          fail_on_unmatched_files: true
