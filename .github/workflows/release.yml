name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: "26.9.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./internal/core/...
      - name: Windows exe has an icon
        run: bash scripts/verify_windows_icon.sh

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/core/version.go)
          fi
          echo "PLY_VERSION=$ver" >> "$GITHUB_ENV"
          echo "LDFLAGS=-s -w -H windowsgui -X ply/internal/core.Version=${ver}" >> "$GITHUB_ENV"
      - name: Icon
        run: python scripts/make_icon.py
        continue-on-error: true
      - name: Winres
        shell: bash
        run: bash scripts/embed_windows_icon.sh
      - name: Build Ply
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist, payload | Out-Null
          go build -trimpath -ldflags="$env:LDFLAGS" -o dist/Ply.exe ./cmd/ply
          go build -trimpath -ldflags="$env:LDFLAGS" -o dist/PlyCore.exe ./cmd/worker
      - name: Fetch Xray
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xrayout -Force
          Copy-Item dist/Ply.exe payload/Ply.exe
          Copy-Item dist/PlyCore.exe payload/PlyCore.exe
          Copy-Item xrayout/xray.exe payload/xray.exe
          Copy-Item xrayout/geoip.dat payload/geoip.dat
          Copy-Item xrayout/geosite.dat payload/geosite.dat
          Copy-Item xrayout/wintun.dll payload/wintun.dll
      - name: Payload zip
        run: |
          Compress-Archive -Path payload\* -DestinationPath cmd/setup/payload.zip -Force
      - name: Build installer
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="$env:LDFLAGS" -o dist/PlySetup.exe ./cmd/setup
          Copy-Item README.txt dist/README.txt
          Compress-Archive -Path dist/PlySetup.exe, dist/README.txt -DestinationPath "dist/Ply-$env:PLY_VERSION-win64.zip" -Force
          Compress-Archive -Path payload\* -DestinationPath "dist/Ply-portable-$env:PLY_VERSION-win64.zip" -Force
      - name: Icon resource
        shell: bash
        run: python scripts/check_pe_icon.py dist/Ply.exe dist/PlyCore.exe dist/PlySetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ply-windows
          path: |
            dist/PlySetup.exe
            dist/Ply-*-win64.zip
            dist/Ply-portable-*-win64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/core/version.go)
          fi
          echo "PLY_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/ply
          ldflags="-s -w -X ply/internal/core.Version=${PLY_VERSION}"
          go build -trimpath -ldflags "$ldflags" -o dist/ply/Ply ./cmd/launch
          go build -trimpath -ldflags "$ldflags" -o dist/ply/PlyCore ./cmd/worker
          cp pack/linux/install.sh dist/ply/install.sh
          chmod +x dist/ply/install.sh dist/ply/Ply dist/ply/PlyCore
          if [ -f assets/icon.png ]; then cp assets/icon.png dist/ply/icon.png; fi
      - name: Fetch Xray
        run: |
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o xray.zip -d xrayout
          cp xrayout/xray dist/ply/xray
          cp xrayout/geoip.dat xrayout/geosite.dat dist/ply/
          chmod +x dist/ply/xray
      - name: Pack
        run: tar -C dist -czf "dist/Ply-${PLY_VERSION}-linux-amd64.tar.gz" ply
      - uses: actions/upload-artifact@v4
        with:
          name: ply-linux
          path: dist/Ply-*-linux-amd64.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/core/version.go)
          fi
          echo "PLY_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build app
        env:
          CGO_ENABLED: "0"
        run: |
          ldflags="-s -w -X ply/internal/core.Version=${PLY_VERSION}"
          APP="dist/Ply.app/Contents/MacOS"
          mkdir -p dist/Ply.app/Contents
          sed -E \
            -e "s#(CFBundleVersion</key><string>)[^<]+#\\1${PLY_VERSION}#" \
            -e "s#(CFBundleShortVersionString</key><string>)[^<]+#\\1${PLY_VERSION}#" \
            pack/macos/Info.plist > dist/Ply.app/Contents/Info.plist
          for arch in amd64 arm64; do
            mkdir -p "${APP}/bin/${arch}"
            GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "${APP}/bin/${arch}/Ply" ./cmd/launch
            GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "${APP}/bin/${arch}/PlyCore" ./cmd/worker
          done
          cp pack/macos/Ply.sh "${APP}/Ply"
          cp pack/macos/install.command dist/install.command
          chmod +x dist/install.command "${APP}/Ply" "${APP}/bin/amd64/"* "${APP}/bin/arm64/"*
      - name: Fetch Xray
        run: |
          curl -fsSL -o x64.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-macos-64.zip"
          curl -fsSL -o xarm.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-macos-arm64-v8a.zip"
          unzip -o x64.zip -d x64
          unzip -o xarm.zip -d xarm
          cp x64/xray dist/Ply.app/Contents/MacOS/bin/amd64/xray
          cp xarm/xray dist/Ply.app/Contents/MacOS/bin/arm64/xray
          cp x64/geoip.dat x64/geosite.dat dist/Ply.app/Contents/MacOS/bin/amd64/
          cp xarm/geoip.dat xarm/geosite.dat dist/Ply.app/Contents/MacOS/bin/arm64/
          chmod +x dist/Ply.app/Contents/MacOS/bin/amd64/xray dist/Ply.app/Contents/MacOS/bin/arm64/xray
      - name: Pack
        run: |
          cp README.txt dist/README.txt
          (cd dist && zip -r "Ply-${PLY_VERSION}-macos.zip" Ply.app install.command README.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ply-macos
          path: dist/Ply-*-macos.zip

  publish:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ply ${{ github.ref_name }}
          body: |
            2.1.7. У Ply.exe, PlyCore.exe и установщика снова есть значок.
            В 2.1.6 его не вшили, поэтому окно, трей и ярлык были пустыми.
            Сборки не подписаны.
            Ключи: vless, hy2, vmess, trojan, ss, socks5.
          files: dist/*
          fail_on_unmatched_files: true
